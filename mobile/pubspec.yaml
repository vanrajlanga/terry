name: terry_eclipso
description: "Terry by eClipso - a trick taking card game. Play online with friends, or offline against bots."
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # talks to the Node server; the server runs socket.io 4.x
  socket_io_client: ^2.0.3+1
  # voice chat, mirroring public/voice.js
  flutter_webrtc: ^0.11.7
  # remembers your name, the server address and the table size
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
