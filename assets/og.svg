<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="felt" cx="50%" cy="16%" r="88%">
      <stop offset="0%" stop-color="#0d5c3f"/>
      <stop offset="60%" stop-color="#073d29"/>
      <stop offset="100%" stop-color="#041d14"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2eee1"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#felt)"/>

  <!-- Five cards fanned about a pivot well below them, so each one's corner
       index stays visible instead of the last card covering the rest. -->
  <g filter="url(#drop)">
    <!-- 10 of spades -->
    <g transform="translate(600 640) rotate(-32) translate(-95 -360)">
      <rect width="190" height="272" rx="18" fill="url(#face)" stroke="#cfc9b8" stroke-width="3"/>
      <text x="24" y="60" font-family="Georgia,serif" font-size="48" font-weight="bold" fill="#1a1a1a">10</text>
      <text x="24" y="108" font-family="Georgia,serif" font-size="44" fill="#1a1a1a">&#9824;</text>
    </g>
    <!-- jack of hearts -->
    <g transform="translate(600 640) rotate(-16) translate(-95 -360)">
      <rect width="190" height="272" rx="18" fill="url(#face)" stroke="#cfc9b8" stroke-width="3"/>
      <text x="24" y="60" font-family="Georgia,serif" font-size="48" font-weight="bold" fill="#c0392b">J</text>
      <text x="24" y="108" font-family="Georgia,serif" font-size="44" fill="#c0392b">&#9829;</text>
    </g>
    <!-- queen of diamonds -->
    <g transform="translate(600 640) rotate(0) translate(-95 -360)">
      <rect width="190" height="272" rx="18" fill="url(#face)" stroke="#cfc9b8" stroke-width="3"/>
      <text x="24" y="60" font-family="Georgia,serif" font-size="48" font-weight="bold" fill="#c0392b">Q</text>
      <text x="24" y="108" font-family="Georgia,serif" font-size="44" fill="#c0392b">&#9830;</text>
    </g>
    <!-- king of clubs -->
    <g transform="translate(600 640) rotate(16) translate(-95 -360)">
      <rect width="190" height="272" rx="18" fill="url(#face)" stroke="#cfc9b8" stroke-width="3"/>
      <text x="24" y="60" font-family="Georgia,serif" font-size="48" font-weight="bold" fill="#1a1a1a">K</text>
      <text x="24" y="108" font-family="Georgia,serif" font-size="44" fill="#1a1a1a">&#9827;</text>
    </g>
    <!-- ace of hearts, face up on top -->
    <g transform="translate(600 640) rotate(32) translate(-95 -360)">
      <rect width="190" height="272" rx="18" fill="url(#face)" stroke="#cfc9b8" stroke-width="3"/>
      <text x="24" y="60" font-family="Georgia,serif" font-size="48" font-weight="bold" fill="#c0392b">A</text>
      <text x="24" y="108" font-family="Georgia,serif" font-size="44" fill="#c0392b">&#9829;</text>
      <text x="95" y="200" font-family="Georgia,serif" font-size="96" text-anchor="middle" fill="#c0392b">&#9829;</text>
    </g>
  </g>

  <text x="600" y="128" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="82"
        font-weight="bold" text-anchor="middle" fill="#ffffff">Terry<tspan fill="#f0c15a">&#160;by eClipso</tspan></text>
  <text x="600" y="182" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="31"
        text-anchor="middle" fill="#bcd6c9">4 or 6 players &#183; 2 teams &#183; 8 kats &#183; bid, call the master colour, take the hands</text>

</svg>
